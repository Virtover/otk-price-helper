<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Glowing price tag icon">
<defs>
<radialGradient id="bg" cx="50%" cy="48%" r="70%">
<stop offset="0%" stop-color="#2c2622"></stop>
<stop offset="100%" stop-color="#110f0e"></stop>
</radialGradient>
<linearGradient id="mid" x1="-120" y1="-80" x2="120" y2="80" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#f4dfba"></stop>
<stop offset="1" stop-color="#d6b484"></stop>
</linearGradient>
<linearGradient id="hi" x1="-120" y1="-80" x2="120" y2="80" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#fffaf0"></stop>
<stop offset="1" stop-color="#f3e0bf"></stop>
</linearGradient>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
<feGaussianBlur stdDeviation="11"></feGaussianBlur>
</filter>
<g id="tag" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M -118 0 L -66 -66 L 96 -66 Q 112 -66 112 -50 L 112 50 Q 112 66 96 66 L -66 66 Z"></path>
<circle cx="-62" cy="0" r="14"></circle>
</g>
</defs>
<rect width="400" height="400" rx="90" fill="url(#bg)"></rect>
<g transform="translate(200 200) rotate(-40) scale(1.3) translate(-3 0)">
<use xlink:href="#tag" stroke="#f3d7a8" stroke-width="15" opacity="0.4" filter="url(#glow)"></use>
<use xlink:href="#tag" stroke="url(#mid)" stroke-width="11"></use>
<use xlink:href="#tag" stroke="url(#hi)" stroke-width="4" opacity="0.8"></use>
</g>
</svg>
